<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#740F2F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="ThatWay Compass"/>
<title>ThatWay · Campus Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body><div id="app">

<!-- ========== CAMPUS COMPASS ========== -->
<div class="view on" id="v-compass">
  <div class="home">
    <div class="tw-brand">
      <div style="font-family:'Oswald',system-ui,sans-serif;font-weight:700;font-size:25px;line-height:1.02;letter-spacing:.02em;color:#fff;text-transform:uppercase;text-align:center">Texas A&amp;M<br>San Antonio</div>
      <div class="sub-brand" style="color:#FFCD00;letter-spacing:.26em;text-transform:uppercase;font-size:12px;font-weight:600;font-family:'Oswald',system-ui,sans-serif;margin-top:11px">Campus Compass</div>
    </div>

    <div class="mid">
      <div class="compass-stage" id="compassStage">
        <div class="halo"></div>
        <div class="radar" id="radar">
          <div class="dial">
            <div class="map" style="background-image:url(images/compass-map.jpg)"></div>
            <div class="needle" id="needle"><b></b></div>
            <div class="hub"></div>
          </div>
        </div>
      </div>
      <div class="ahead">
        <div class="lbl">Ahead of you</div>
        <div class="bldg" id="aheadName">—</div>
        <div class="dist" id="aheadDist">Enable the compass to begin</div>
      </div>
    </div>

    <div class="homebottom">
      <button class="btn-enable" id="enableBtn" onclick="enableSensors()">Enable compass</button>
    </div>
  </div>
</div>

<div id="toast"></div>
</div>
<script src="app.js"></script>
</body></html>
