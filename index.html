<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#740F2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ThatWay">
<title>ThatWay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Vollkorn:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--maroon:#740F2F;--deep:#4E0A20;--hi:#8C1D3E;--yellow:#FFCD00;--ink:#020000;--blue:#15358B}
html,body{height:100%}
body{font-family:'Vollkorn',Georgia,serif;color:#fff;-webkit-print-color-adjust:exact;
  background:radial-gradient(130% 90% at 50% -10%,var(--hi),var(--maroon) 46%,var(--deep));
  min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0) + 24px) 22px calc(env(safe-area-inset-bottom,0) + 26px)}
.dome{position:fixed;right:-60px;bottom:-50px;width:340px;opacity:.06;pointer-events:none}
.wrap{flex:1;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;justify-content:center}
.card{display:flex;align-items:center;gap:16px;width:100%;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;
  padding:24px 20px;margin-bottom:18px;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.card:hover{transform:translateY(-2px);border-color:rgba(255,205,0,.6);background:rgba(255,255,255,.1)}
.card:active{transform:scale(.99)}
.card .ic{flex:none;width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.card .ic svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card.compass .ic{background:linear-gradient(145deg,#1c47b8,var(--blue))}
.card.indoor .ic{background:linear-gradient(145deg,var(--hi),var(--deep));border:1.5px solid var(--yellow)}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.card .t{display:block;font-family:'Oswald',sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.card .d{display:block;font-size:14px;color:rgba(255,255,255,.66);margin-top:5px}
.card .step{display:block;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin-top:8px}
.card .go{flex:none;color:var(--yellow);font-size:28px;font-family:'Oswald',sans-serif}
.foot{text-align:center;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.5)}
.foot .dot{color:var(--yellow)}
</style></head>
